status:
  scope: >
    A formal certificate that Facts 1-8 imply Theorem 1.1 (1)-(2). The $q$-supernomial is
    opaque, constrained only by Facts 1-3.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
  - declaration: "ProblemHJOa3.thm_main"
    file: "RRA3/solution.lean"
    sorry_count: 0
    axioms: [propext, Classical.choice, Quot.sound]
    comparator_config: "comparator.json"
    literature_dependencies:
    - statement: >
        `Fact1` (rigged-configuration expansion): Schilling's fermionic formula for the $A_1$
        completely symmetric $q$-supernomial with two-part content.
      source: "q-supernomial coefficients: from riggings to ribbons, (2.1)-(2.3); Proposition 2.3 of the paper"
    - statement: >
        `Fact2Bundle`, Fact 2 specialized to the two component orders used in the proof
        (multitableau expansion and order-independence):
        $\widetilde{S}_{\lambda\mu}(q) = \sum_T q^{\mathrm{inv}(T)}$ over tuples of one-row
        semistandard $\{1,2\}$-tableaux with row lengths the parts of $\mu$ and content
        $\lambda$, for every ordering of the parts of $\mu$; in particular the sum is
        independent of that ordering. This order-independence is the deepest input: it is what
        reconciles the two congruence classes $b \equiv \pm 1 \pmod 3$.
      source: "q-supernomial coefficients: from riggings to ribbons, Section 3.2 and Theorem 4.1; Proposition 2.1 of the paper"
    - statement: >
        `Fact3` (content symmetry): $\widetilde{S}_{\lambda\mu}(q)$ is invariant under
        permuting the parts of the content $\lambda$; in particular
        $\widetilde{S}_{(A,B),\mu} = \widetilde{S}_{(B,A),\mu}$.
      source: "Supernomial coefficients, polynomial identities and q-series, Section 2; equation (11) of the paper"
    - statement: >
        `Fact4` (Warnaar's $A_2$ Andrews-Gordon identities): the two fermionic-sum $=$
        theta-product evaluations, the modulus-$(3k+2)$ identity for $k \ge 2$ and the
        modulus-$(3k+4)$ identity for $k \ge 1$.
      source: "The $A_2$ Andrews-Gordon identities and cylindric partitions, (1.10)-(1.11), building on Hall-Littlewood functions and the $A_2$ Rogers-Ramanujan identities; Proposition 2.4 of the paper"
    - statement: >
        `Fact5` ($q$-binomial reciprocity): for $0 \le j \le N$,
        $\binom{N}{j}_{q^{-1}} = q^{-j(N-j)} \binom{N}{j}_q$.
      source: "Classical"
    - statement: >
        `Fact6` (elementary Gaussian and Pochhammer identities): the two $q$-Pascal recurrences,
        the factorization $(q)_j (q)_{N-j} \binom{N}{j}_q = (q)_N$, vanishing of
        $\binom{N}{j}_q$ for $j > N$, and the telescoping of a chain of Gaussian polynomials
        against $1/(q)_{r_1}$ into a product of Pochhammer reciprocals.
      source: "Classical; The Theory of Partitions, Ch. 3"
    - statement: >
        `Fact7` (Sylvester's gap facts): for coprime $a, b > 1$, the gap set of the numerical
        semigroup $\langle a, b \rangle$ has cardinality $(a-1)(b-1)/2$, has maximum (the
        Frobenius number) $ab - a - b$, and satisfies the symmetry that for $0 \le s \le
        ab-a-b$, $s$ is a gap if and only if $ab - a - b - s$ is not.
      source: "Classical; The Diophantine Frobenius Problem, Ch. 2"
    - statement: >
        `Fact8` (positivity of the HJO quadratic form): on the cone $\mathcal{C}_{a,b}$ the
        quadratic form $Q_{a,b}$ is positive definite and satisfies
        $\|n\|_\infty^2 \le |G| \, Q_{a,b}(n)$, so each coefficient of $Z_{a,b}(q)$ receives
        finitely many contributions and $Z_{a,b}(q)$ is a well-defined formal power series.
      source: "A quadratic form generalization of rational dinv (Theorem 1.3)"

